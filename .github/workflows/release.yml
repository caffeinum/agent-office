name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node bin/agent-office --help >/dev/null
      - run: gh release create "$GITHUB_REF_NAME" bin/agent-office --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

name: AgentOfficeTV
options:
  bundleIdPrefix: com.bykhun
  deploymentTarget:
    tvOS: "17.0"
targets:
  AgentOfficeTV:
    type: application
    platform: tvOS
    sources:
      - AgentOfficeTV/Sources
      - path: AgentOfficeTV/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bykhun.agentoffice.tv
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Office
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AE86HBQRXP
